name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Offline PWA end-to-end (Chromium)
        run: |
          pnpm --filter @ttkpr/viewer exec playwright install --with-deps chromium
          pnpm --filter @ttkpr/viewer e2e

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ttk
          POSTGRES_PASSWORD: ttk
          POSTGRES_DB: ttk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttk" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ttk:ttk@localhost:5432/ttk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/map-schema/src apps/api/src apps/worker/src
      - name: Migrations match models
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://ttk:ttk@localhost:5432/ttk_test
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  openapi:
    # The generated client must be committed in sync with the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git diff --exit-code packages/api-client
