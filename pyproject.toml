[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/map-schema"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Russian UI strings are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "map_schema"]

[tool.ruff.lint.per-file-ignores]
"apps/api/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = ["packages/map-schema/src", "apps/api/src", "apps/worker/src"]

[[tool.mypy.overrides]]
module = "worker.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["packages/map-schema/tests", "apps/api/tests", "apps/worker/tests"]
