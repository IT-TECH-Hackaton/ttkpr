[project]
name = "api"
version = "0.1.0"
description = "API: auth, maps, publishing"
authors = [
    { name = "ETsETs777", email = "cymbalzena087@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.118",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "geoalchemy2>=0.20.0",
    "map-schema",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
map-schema = { workspace = true }
