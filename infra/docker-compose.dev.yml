# Only the backing services for running api, worker and frontends on the host
# (uploads go to the local data/storage folder):
#   docker compose -f infra/docker-compose.dev.yml up -d
name: ttkpr-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ttk
      POSTGRES_PASSWORD: ttk
      POSTGRES_DB: ttk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
