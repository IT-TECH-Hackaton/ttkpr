# Full stack: docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
name: ttkpr

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ttk}:${POSTGRES_PASSWORD:-ttk}@postgres:5432/${POSTGRES_DB:-ttk}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-ttk}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ttk-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ttk-local-secret}

services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      VIEWER_HOST: ${VIEWER_HOST:-localhost}
      STUDIO_HOST: ${STUDIO_HOST:-studio.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *backend-env
      PUBLIC_BASE_URL: https://${VIEWER_HOST:-localhost}
      CORS_ORIGINS: '["https://${VIEWER_HOST:-localhost}", "https://${STUDIO_HOST:-studio.localhost}"]'
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttk}
      POSTGRES_DB: ${POSTGRES_DB:-ttk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  s3:
    # S3-compatible storage for local work (MinIO no longer publishes community images).
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    ports:
      - "8333:8333"
    restart: unless-stopped

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  s3-data:
