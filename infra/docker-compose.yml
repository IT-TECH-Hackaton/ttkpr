# Full stack: docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
name: ttkpr

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ttk}:${POSTGRES_PASSWORD:-ttk}@postgres:5432/${POSTGRES_DB:-ttk}
  REDIS_URL: redis://redis:6379/0
  # Frames, panoramas and plan images; shared by api and worker, served under /media.
  STORAGE_DIR: /data/storage
  # Signs invites and capture QR codes; the API refuses to start with a placeholder.
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in infra/.env (openssl rand -hex 32)}
  APP_ENV: production

services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        # Empty: links use the address the page was opened at (open the studio by domain or LAN IP).
        VITE_PUBLIC_URL: ${PUBLIC_URL:-}
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *backend-env
      # Viewer and studio share one origin, so API calls are same-origin: no CORS needed.
      CORS_ORIGINS: "[]"
    volumes:
      - storage:/data/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-off: test accounts and a published demo map.
  #   docker compose -f infra/docker-compose.yml --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *backend-env
    command: ["python", "-m", "api.seed"]
    volumes:
      - storage:/data/storage
      - ../fixtures:/app/fixtures:ro
      - ../apps/viewer/public/demo:/app/apps/viewer/public/demo:ro
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttk}
      POSTGRES_DB: ${POSTGRES_DB:-ttk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  storage:
